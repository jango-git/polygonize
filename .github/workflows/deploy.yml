name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/pipeline

      - name: Install wasm-bindgen-cli
        run: |
          curl -sSL https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.126/wasm-bindgen-0.2.126-x86_64-unknown-linux-musl.tar.gz | tar xz -C "$HOME"
          echo "$HOME/wasm-bindgen-0.2.126-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: Install wasm-opt (binaryen)
        run: |
          curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_119/binaryen-version_119-x86_64-linux.tar.gz | tar xz -C "$HOME"
          echo "$HOME/binaryen-version_119/bin" >> "$GITHUB_PATH"

      - run: npm ci
      - run: npm run build

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r dist _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
